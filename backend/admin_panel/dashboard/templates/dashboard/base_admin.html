<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Admin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        auraBg: '#0D0D0E',
                        auraSurface: '#18181B',
                        auraBorder: '#2E2E34',
                        auraText: '#F4F4F5',
                        auraMuted: '#A1A1AA',
                        auraGold: '#D4AF37',
                        auraGoldMuted: 'rgba(212, 175, 55, 0.1)',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0D0D0E; }
        ::-webkit-scrollbar-thumb { background: #2E2E34; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body class="bg-auraBg font-sans text-auraText min-h-screen flex selection:bg-auraGold selection:text-auraBg">

    <!-- Left Sidebar [A] -->
    <aside class="w-64 bg-auraBg border-r border-auraBorder flex flex-col fixed h-full z-20">
        <!-- Logo Area -->
        <div class="p-8 pb-10">
            <h1 class="font-serif text-3xl tracking-[0.25em] text-white uppercase mb-2">AURA</h1>
            <p class="text-[9px] uppercase tracking-[0.3em] text-auraMuted font-medium">Luxury Fragrance Admin</p>
        </div>

        <!-- Navigation Items -->
        <nav class="flex-1 px-4 space-y-2">
            <!-- DASHBOARD -->
            <a href="{% url 'dashboard:index' %}" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'dashboard' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="layout-grid" class="w-4 h-4 {% if request.resolver_match.app_name != 'dashboard' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'dashboard' %}font-semibold{% else %}font-medium{% endif %}">Dashboard</span>
                </div>
            </a>
            
            <!-- PRODUCTS -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'products' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="box" class="w-4 h-4 {% if request.resolver_match.app_name != 'products' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'products' %}font-semibold{% else %}font-medium{% endif %}">Products</span>
                </div>
            </a>

            <!-- CATEGORIES -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'categories' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="layers" class="w-4 h-4 {% if request.resolver_match.app_name != 'categories' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'categories' %}font-semibold{% else %}font-medium{% endif %}">Categories</span>
                </div>
            </a>

            <!-- BRANDS -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'brands' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="gem" class="w-4 h-4 {% if request.resolver_match.app_name != 'brands' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'brands' %}font-semibold{% else %}font-medium{% endif %}">Brands</span>
                </div>
            </a>

            <!-- ORDERS -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'orders' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="shopping-bag" class="w-4 h-4 {% if request.resolver_match.app_name != 'orders' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'orders' %}font-semibold{% else %}font-medium{% endif %}">Orders</span>
                </div>
            </a>

            <!-- USERS -->
            <a href="{% url 'users:index' %}" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'users' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="users" class="w-4 h-4 {% if request.resolver_match.app_name != 'users' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'users' %}font-semibold{% else %}font-medium{% endif %}">Users</span>
                </div>
            </a>

            <!-- COUPONS -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'coupons' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="ticket" class="w-4 h-4 {% if request.resolver_match.app_name != 'coupons' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'coupons' %}font-semibold{% else %}font-medium{% endif %}">Coupons</span>
                </div>
            </a>

            <!-- SALES REPORT -->
            <a href="#" class="flex items-center justify-between py-3 px-4 rounded-sm transition-all duration-300 group relative overflow-hidden {% if request.resolver_match.app_name == 'reports' %}bg-auraSurface border-r-2 border-auraGold text-auraGold{% else %}text-auraMuted hover:text-white hover:bg-auraSurface/50{% endif %}">
                <span class="absolute inset-0 w-full h-full bg-auraGoldMuted opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <div class="flex items-center gap-3 relative z-10">
                    <i data-lucide="bar-chart-2" class="w-4 h-4 {% if request.resolver_match.app_name != 'reports' %}group-hover:text-auraGold transition-colors duration-300{% endif %}"></i>
                    <span class="text-xs uppercase tracking-widest {% if request.resolver_match.app_name == 'reports' %}font-semibold{% else %}font-medium{% endif %}">Sales Report</span>
                </div>
            </a>
        </nav>

        <!-- Logout Form -->
        <div class="p-4 mt-auto border-t border-auraBorder">
            <form action="{% url 'admin_auth:logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center gap-3 py-3 px-4 text-auraMuted hover:text-white hover:bg-auraSurface/50 rounded-sm transition-all duration-300 group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:text-red-400 transition-colors duration-300"></i>
                    <span class="text-xs uppercase tracking-widest font-medium">Logout</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        
        <!-- Top Navbar [B] -->
        <header class="h-20 bg-auraBg border-b border-auraBorder flex items-center justify-between px-10 sticky top-0 z-10">
            <!-- Breadcrumbs -->
            <div class="text-[10px] text-auraMuted uppercase tracking-widest font-medium">
                {% block breadcrumbs %}ADMIN / <span class="text-auraGold">DASHBOARD</span>{% endblock %}
            </div>
            
            <!-- Admin Profile -->
            <div class="flex items-center gap-4 cursor-pointer group">
                <span class="text-xs uppercase tracking-widest font-semibold group-hover:text-auraGold transition-colors duration-300">Mohammed Adnan</span>
                <i data-lucide="chevron-down" class="w-3 h-3 text-auraMuted group-hover:text-auraGold transition-colors duration-300"></i>
                <div class="w-8 h-8 rounded-full border border-auraBorder flex items-center justify-center bg-auraSurface group-hover:border-auraGold transition-colors duration-300">
                    <i data-lucide="user" class="w-4 h-4 text-auraMuted group-hover:text-auraGold transition-colors duration-300"></i>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="flex-1 p-10 bg-[#0A0A0B]"> <!-- Slightly darker content area -->
            {% block admin_content %}
            {% endblock %}
        </div>
    </main>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
    <script>
        /*
         * BFCache (Back/Forward Cache) Defence
         * Forces a full server reload if this admin page is restored from BFCache
         * via the Back button, ensuring session & permission checks always run.
         */
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
